<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARDAY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></symbol>
  <symbol id="i-ai" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
</svg>

<div id="splash">
  <svg class="ic logo"><use href="#i-logo"/></svg>
  <div class="brand big"></div>
  <p class="by">Created by ABDI</p>
</div>

<header class="top">
  <div class="row"><svg class="ic"><use href="#i-logo"/></svg><div class="brand"></div></div>
  <span class="by">Created by ABDI</span>
</header>

<main>
  <section id="home" class="page active">
    <div class="hero">
      <h1 id="hello"></h1>
      <p data-i="home_sub"></p>
      <button class="btn" data-go="plan"><svg class="ic"><use href="#i-play"/></svg><span data-i="start"></span></button>
    </div>
    <div class="stats">
      <div><b id="st-n">0</b><small data-i="stat_n"></small></div>
      <div><b id="st-a">-</b><small data-i="stat_a"></small></div>
      <div><b id="st-m">0</b><small data-i="stat_m"></small></div>
    </div>
    <h2 data-i="news_t"></h2>
    <div class="card"><p data-i="news1"></p></div>
    <div class="card"><p data-i="news2"></p></div>
  </section>

  <section id="plan" class="page">
    <div id="planForm" class="card">
      <h2 data-i="plan_t"></h2>
      <label data-i="l_name"></label>
      <input id="fName" type="text" maxlength="60" data-p="ph_name">
      <label data-i="l_plan"></label>
      <textarea id="fPlan" rows="3" maxlength="200" data-p="ph_plan"></textarea>
      <label data-i="l_time"></label>
      <div class="two">
        <input id="fTime" type="number" min="1" max="600" value="25">
        <select id="fUnit"><option value="m" data-i="u_min"></option><option value="h" data-i="u_h"></option></select>
      </div>
      <p id="err" class="err" role="alert"></p>
      <button id="startBtn" class="btn"><svg class="ic"><use href="#i-play"/></svg><span data-i="start"></span></button>
    </div>

    <div id="run" class="card center" hidden>
      <p class="mut" data-i="run_for"></p>
      <h2 id="runName"></h2>
      <p id="runPlan" class="mut"></p>
      <div class="ringwrap">
        <svg viewBox="0 0 220 220"><circle class="bg" cx="110" cy="110" r="96"/><circle id="ring" class="fg" cx="110" cy="110" r="96"/></svg>
        <div id="clock">00:00</div>
      </div>
      <button id="stopBtn" class="btn ghost"><svg class="ic"><use href="#i-check"/></svg><span data-i="stop"></span></button>
    </div>

    <div id="result" class="card center" hidden>
      <p class="mut" data-i="res_t"></p>
      <div id="rate" class="rate">0/10</div>
      <p id="rdet" class="mut"></p>
      <p id="rmsg"></p>
      <button id="againBtn" class="btn"><span data-i="again"></span></button>
    </div>
  </section>

  <section id="ai" class="page">
    <h2 data-i="ai_t"></h2>
    <div id="chat" class="chat"></div>
    <div class="send">
      <input id="aiQ" type="text" data-p="ph_ai">
      <button id="aiBtn" class="btn sm" aria-label="Send"><svg class="ic"><use href="#i-send"/></svg></button>
    </div>
  </section>

  <section id="settings" class="page">
    <div class="card">
      <h2 data-i="p_t"></h2>
      <input id="pName" type="text" maxlength="30" data-p="ph_pname">
      <button id="pSave" class="btn sm"><span data-i="save"></span></button>
    </div>
    <div class="card">
      <h2 data-i="lang_t"></h2>
      <div class="seg"><button data-lang="so">Somali</button><button data-lang="en">English</button></div>
    </div>
    <div class="card">
      <h2 data-i="theme_t"></h2>
      <div class="seg"><button data-theme="dark" data-i="dark"></button><button data-theme="light" data-i="light"></button></div>
    </div>
    <div class="card">
      <div class="row between"><h2 data-i="hist_t"></h2><button id="clr" class="btn ghost sm"><span data-i="clear"></span></button></div>
      <div id="hist"></div>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-go="home" class="on"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></button>
  <button data-go="plan"><svg class="ic"><use href="#i-plan"/></svg><span>Qorshe</span></button>
  <button data-go="ai"><svg class="ic"><use href="#i-ai"/></svg><span>AI Support</span></button>
  <button data-go="settings"><svg class="ic"><use href="#i-set"/></svg><span>Settings</span></button>
</nav>

<div id="ov" class="ov" hidden>
  <div class="card center">
    <h2 data-i="ov_t"></h2>
    <p id="ovTxt"></p>
    <button id="ovBtn" class="btn"><span data-i="ov_btn"></span></button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
